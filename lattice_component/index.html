<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px Arial,sans-serif;color:#142B49;background:white}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #007F86}#scroll{overflow-x:auto}#tree{position:relative;margin:auto}svg{position:absolute;inset:0;pointer-events:none}.node{position:absolute;width:148px;height:74px;border:1px solid #90aabc;border-radius:9px;background:white;color:#142B49;line-height:1.5}.node strong{color:#aa2435}.node.selected{border:3px solid #007F86}.node.done{background:#eaf4ff}.node.Continue{background:#e4f3ec}.node.Abandon{background:#fbeaec}.label{position:absolute;text-align:center;width:148px;color:#0756A3;font-size:14px}#panel{border-top:1px solid #ccdbe5;padding:16px 4px}#message{padding:10px;background:#eaf4ff;margin:8px 0}.error{color:#a52031}.warning{color:#795300}input{padding:10px;border:1px solid #8da7ba;border-radius:5px;width:min(420px,70%)}#check{background:#007f86;color:white;padding:11px;border:0;border-radius:5px}code{display:block;margin:12px 0;line-height:1.6;white-space:normal}details{margin:12px 0}summary{cursor:pointer}#hint{color:#0756a3}
</style></head><body><div id="scroll"><div id="tree"></div></div><div id="panel"></div><script>
let data,selected=null,signature='',drafts={};const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function size(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+10})}
function panel(){const el=document.getElementById('panel');el.replaceChildren();if(!selected){el.textContent='Click a payoff node on the right to begin.';size();return}const z=data.nodes.find(x=>x.id===selected);if(!z)return;
const title=document.createElement('b');title.textContent=`Step ${z.i}, ${z.j} down move(s) · ${z.i===data.n?'maturity payoff':'option value'}`;el.append(title);
const msg=document.createElement('div');msg.id='message';el.append(msg);
if(!z.ready&&!data.reveal){msg.className='warning';msg.textContent='Work from right to left: complete both connected nodes in the next period first.';size();return}
if(data.feedback&&data.feedback.node===selected){msg.className=data.feedback.ok?'':'error';msg.textContent=data.feedback.text}else msg.textContent=z.done?'Correct value is already in the lattice. You can review or try another node.':'Enter an expression using the inputs below. The calculator handles the arithmetic.';
if(data.offerColumn!==undefined&&data.offerColumn!==null&&z.i===data.offerColumn){
const prompt=document.createElement('div');prompt.style.margin='12px 0';const question=document.createElement('p');question.textContent='Should I compute all the remaining values in this column?';prompt.append(question);
for(const [label,action] of [['Yes · fill this column','fill_column'],['No · I will calculate each cell','manual_column']]){const btn=document.createElement('button');btn.textContent=label;btn.style.padding='10px';btn.style.marginRight='8px';btn.onclick=()=>send('streamlit:setComponentValue',{value:{action,column:data.offerColumn,nonce:Date.now()},dataType:'json'});prompt.append(btn)}el.append(prompt);}
const inputs=document.createElement('code');inputs.textContent=Object.entries(z.vars).map(([k,v])=>`${k} = ${Number(v).toFixed(6)}`).join(' · ');el.append(inputs);
const form=document.createElement('form'),input=document.createElement('input'),button=document.createElement('button');input.setAttribute('aria-label','Node expression');input.placeholder='Enter your expression';input.value=drafts[selected]||'';input.oninput=()=>drafts[selected]=input.value;button.textContent='Check';button.id='check';form.append(input,button);form.onsubmit=e=>{e.preventDefault();send('streamlit:setComponentValue',{value:{node:selected,expression:input.value,nonce:Date.now()},dataType:'json'})};el.append(form);
const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Hint';details.append(summary);const hint=document.createElement('p');hint.textContent=z.hint;details.append(hint);details.ontoggle=size;el.append(details);
if(data.reveal){const answer=document.createElement('code');answer.textContent=z.solution;el.append(answer)}size();}
function render(){const tree=document.getElementById('tree'),w=180*(data.n+1),h=160+90*data.n;tree.style.width=w+'px';tree.style.height=h+'px';tree.replaceChildren();const xy=(i,j)=>[16+180*i,40+45*(data.n-i+2*j)];let edges='';for(const z of data.nodes){if(z.i<data.n){const [x,y]=xy(z.i,z.j);for(const j of [z.j,z.j+1]){const [xx,yy]=xy(z.i+1,j);edges+=`<line x1="${x+74}" y1="${y+37}" x2="${xx+74}" y2="${yy+37}" stroke="#9bafbd"/>`}}}tree.innerHTML=`<svg width="${w}" height="${h}">${edges}</svg>`;
for(let i=0;i<=data.n;i++){for(const [top,text] of [[5,`Step ${i} · t = ${(i*data.dt).toFixed(2)}`],[h-23,data.costs[i]===undefined?(i===data.n?`Strike K = ${data.K}`:'No gate'):`Gate G = ${data.costs[i]}`]]){let a=document.createElement('div');a.className='label';a.style.left=(16+180*i)+'px';a.style.top=top+'px';a.textContent=text;tree.append(a)}}
for(const z of data.nodes){let b=document.createElement('button');const [x,y]=xy(z.i,z.j);b.style.left=x+'px';b.style.top=y+'px';b.className='node'+(z.done?' done '+z.action:'')+(selected===z.id?' selected':'');b.setAttribute('aria-label',`Node ${z.i},${z.j}`);b.innerHTML=`S = ${z.S.toFixed(2)}<br><strong>V = ${z.display}</strong>${z.done?'<br>'+z.action:''}`;b.onclick=()=>{selected=z.id;render()};tree.append(b)}panel();}
window.addEventListener('message',e=>{if(e.data.type==='streamlit:render'){data=e.data.args;if(signature!==data.signature){signature=data.signature;selected=null;drafts={}}render()}});send('streamlit:componentReady',{apiVersion:1});window.addEventListener('resize',size);
</script></body></html>
